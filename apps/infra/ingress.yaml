# Self-contained Ingress (habit-api-ingress pattern). Reuses the wildcard
# certificate (tls-secret, *.bit-habit.com) — no cert-manager annotation.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infra-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - infra.bit-habit.com
      secretName: tls-secret
  rules:
    - host: infra.bit-habit.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infra-svc
                port:
                  number: 80
